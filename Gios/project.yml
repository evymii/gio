name: Gios
options:
  bundleIdPrefix: com.campusgame
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Firebase: only the products we use are linked (Auth now; Analytics, Remote Config, Crashlytics next).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gios:
    type: application
    platform: iOS
    sources:
      - Gios
    dependencies:
      - package: Firebase
        product: FirebaseAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campusgame.gios
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Where the app talks to Gapi: the deployed API on Render (free tier sleeps; first request can take ~50 s).
        Debug:
          GAPI_BASE_URL: "https:/$()/gio-wbqj.onrender.com"
        Release:
          GAPI_BASE_URL: "https:/$()/gio-wbqj.onrender.com"
    info:
      path: Gios/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gios
        GAPI_BASE_URL: $(GAPI_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Gios shows campus spots near you, verifies your check-ins, and shares your location with friends you choose."
        # Firebase phone auth falls back to a reCAPTCHA web page that returns via this scheme
        # ("app-" + GOOGLE_APP_ID with ":" → "-", from GoogleService-Info.plist).
        CFBundleURLTypes:
          - CFBundleURLSchemes: [app-1-760780070218-ios-601877eca2943d7b8935b3]
  GiosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GiosTests
    dependencies:
      - target: Gios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campusgame.gios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gios:
    build:
      targets:
        Gios: all
        GiosTests: [test]
    test:
      targets:
        - GiosTests
