name: Gios
options:
  bundleIdPrefix: com.campusgame
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Firebase: only the products we use are linked (Auth, Analytics, Remote Config, Crashlytics, In-App Messaging).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gios:
    type: application
    platform: iOS
    sources:
      - Gios
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseInAppMessaging-Beta
    postBuildScripts:
      # Uploads debug symbols so Crashlytics can show the exact Swift line of a crash.
      - name: Crashlytics dSYM upload
        basedOnDependencyAnalysis: false
        script: |
          if [ -f "${PROJECT_DIR}/Gios/Resources/GoogleService-Info.plist" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campusgame.gios
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Crashlytics needs dSYMs (Debug too, so simulator test crashes are readable) and an unsandboxed upload script.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # Keep all code in the main binary (no Gios.debug.dylib) so the dSYM upload covers every crash frame.
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Where the app talks to Gapi: the deployed API on Render (free tier sleeps; first request can take ~50 s).
        Debug:
          GAPI_BASE_URL: "https:/$()/gio-wbqj.onrender.com"
        Release:
          GAPI_BASE_URL: "https:/$()/gio-wbqj.onrender.com"
    info:
      path: Gios/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gios
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GAPI_BASE_URL: $(GAPI_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Gios shows campus spots near you, verifies your check-ins, and shares your location with friends you choose."
        # Firebase phone auth falls back to a reCAPTCHA web page that returns via this scheme
        # ("app-" + GOOGLE_APP_ID with ":" → "-", from GoogleService-Info.plist).
        CFBundleURLTypes:
          - CFBundleURLSchemes: [app-1-760780070218-ios-601877eca2943d7b8935b3]
          # Deep links (e.g. In-App Messaging buttons): gios://home | map | friends | profile
          - CFBundleURLSchemes: [gios]
  GiosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GiosTests
    dependencies:
      - target: Gios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campusgame.gios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gios:
    build:
      targets:
        Gios: all
        GiosTests: [test]
    run:
      # Analytics DebugView: events from Debug runs show up live in the Firebase console.
      commandLineArguments:
        "-FIRDebugEnabled": true
    test:
      targets:
        - GiosTests
