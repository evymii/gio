name: Gios
options:
  bundleIdPrefix: com.campusgame
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gios:
    type: application
    platform: iOS
    sources:
      - Gios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campusgame.gios
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Where the app talks to Gapi: the deployed API on Render (free tier sleeps; first request can take ~50 s).
        Debug:
          GAPI_BASE_URL: "https:/$()/gio-wbqj.onrender.com"
        Release:
          GAPI_BASE_URL: "https:/$()/gio-wbqj.onrender.com"
    info:
      path: Gios/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gios
        GAPI_BASE_URL: $(GAPI_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Gios shows campus spots near you, verifies your check-ins, and shares your location with friends you choose."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Gios connects to your development server on this network."
  GiosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GiosTests
    dependencies:
      - target: Gios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campusgame.gios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gios:
    build:
      targets:
        Gios: all
        GiosTests: [test]
    test:
      targets:
        - GiosTests
